- datetime: 2026-11-03 15:24
  title: Agent ships inside the plugin via AgentEditor.update upsert
  tags:
    - architecture
    - agent
    - opencode-v2
    - research
  change: >-
    Decided that the jevCode agent is registered by the plugin itself with ctx.agent.transform(editor =>
    editor.update("jevCode", ...)), guarded by a canary (ctx.agent.list) and an optional packaged agents/jevCode.md
    fallback file. Written into specs/jev-code-router/design.md (D2, F1-F2).
  reason: >-
    feature.md assumed a companion .opencode/agents/jevCode.md because AgentEditor has no add(). A probe plugin on
    OpenCode 2.2.5 showed editor.update on an unknown id creates the agent (listed with mode primary), so no companion
    file is required. The behaviour is undocumented, hence the canary and the fallback.
  invariant: >-
    jevCode must copy build's permissions and never widen them. If OpenCode stops creating agents on update, the canary
    must log an error and the plugin must keep working for other agents. Do not edit build/plan agents.
  files:
    - specs/jev-code-router/design.md
    - specs/jev-code-router/story.md
- datetime: 2026-11-03 15:24
  title: Provider-neutral Jev client with three transports and fail-open fallback
  tags:
    - architecture
    - jev
    - resilience
  change: >-
    Design D4/D6: internal question model (choice/noul/score) mapped to OpenCode-native generate.decisions, TypeSafe
    HTTP and OpenRouter transports; provider=auto prefers native decision model, then TYPESAFE_API_KEY, then
    OPENROUTER_API_KEY, else deterministic fallback plan (keep model, no skills, all tools, no pruning).
  reason: >-
    Local OpenCode 2.2.5 lists 45 chat models and zero decision models, so native Jev cannot be the only path.
    feature.md requires that Jev failures never make the agent unusable.
  invariant: >-
    Hooks never throw and never wait longer than timeoutMs on Jev. All Jev answers are validated against closed sets
    built in code; arbitrary model/skill/tool strings are never applied. Secrets are never logged.
  files:
    - specs/jev-code-router/design.md
- datetime: 2026-11-03 15:24
  title: Two-stage routing and unit-based safe pruning
  tags:
    - architecture
    - routing
    - context
  change: >-
    Design D3/D7: Stage A in the prompt hook batches model+skills+tool groups in one Jev request; Stage B in the context
    hook handles context relevance once per turn and re-applies the cached plan on continuations. Pruning works on units
    with tool-call/tool-result pairs indivisible and a post-condition check that discards the prune on any orphan.
  reason: >-
    Prompt hook runs once per prompt but has no agent or messages; context hook runs before every model call but must
    not call Jev each continuation. Removing half of a tool pair makes providers reject the request.
  invariant: >-
    At most one Jev call per prompt in stage A and one in stage B per turn; zero on continuations. Pruned output never
    contains an orphan tool part. Persisted history is never modified.
  files:
    - specs/jev-code-router/design.md
    - specs/jev-code-router/story.md
