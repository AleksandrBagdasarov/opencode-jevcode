title: 'Phase 2: dynamic coding-model selection, TurnPlan cache and prompt hook (stage A)'
status: closed
depends:
  - 0002-jevcode-agent-and-isolation.yaml
  - 0003-jev-client-and-transports.yaml
tags:
  - BE
  - TL
  - QA
next_responsibility: PM
scope: >-
  src/router/plan.ts, src/router/model-router.ts, src/opencode/prompt-hook.ts,
  src/state/session-state.ts (plan cache), tests. Out of scope: skills, tool groups, context pruning
  (later tickets plug into the same batched request).
description: >-
  Implements story R2, R6.1-R6.3 and design D3/D5/D6, stage A. Build the model candidate catalog
  from ctx.model.list() (enabled, active status, type chat, capabilities.tools) or from the `models`
  allowlist, each with provider, id, context window, price and a plugin profile
  (fast/balanced/reasoning/large-context derived from price/context unless configured). Cap
  candidates (<= 12). Ask Jev one `choice` question over candidate keys plus `keep`; map the answer
  back to a validated candidate; below modelMinConfidence or failure => keep current model. Call
  ctx.session.switchModel only when different; record {previous, applied} via the restore memory
  from 0002. The prompt hook resolves the agent (0002), exits for non-jev agents (after running
  restore), builds/stores the TurnPlan, and is structured so skills and tool groups (0005/0006) add
  questions to the SAME batched request. SPIKE FIRST: verify with a real opencode 2.2.5 run (a mock
  OpenAI-compatible provider registered with ctx.provider.transform or a configured cheap model)
  that calling switchModel inside the prompt hook (a) does not deadlock and (b) takes effect for
  that same prompt's model request. If not, implement the documented fallback from design section 5
  and log an ADR with the evidence. Hook callbacks must never throw.
notes: >-
  TL consulted if the spike shows switchModel cannot work in the prompt hook. Candidate profiles are
  plugin-defined, not OpenCode categories.

