  used it (captured evidence in the ticket notes)

  [2026-11-03T15:06:34.652Z] HAND-OFF BE → QA: BE done, all 7 AC toggled. Files: src/router/plan.ts
  (TurnPlan, fallbackPlan, turnKeyFor, shared turnPlans cache, StageAContributor contract),
  src/router/model-router.ts (candidates<=12, allowlist, profiles, choice question, pickChoice
  mapping), src/opencode/prompt-hook.ts (hook + promptHookModule, registered in src/index.ts),
  src/state/session-state.ts (createPlanCache, separate section). Tests:
  tests/router/{model-router,prompt-hook}.test.ts (unit, fakes) + opt-in e2e
  tests/integration/prompt-hook.int.test.ts (OPENCODE_INTEGRATION=1). Verified: bun test 203 pass/12
  skip/0 fail, bunx tsc --noEmit clean, OPENCODE_INTEGRATION=1 bun test tests/integration 8/8 pass.

  E2E evidence (opencode 2.2.5, mock provider + mock TypeSafe, models allowlist = 3 mocks): jevCode
  run started on mock/m-small, Jev chose mock/m-big -> 1 batched Jev request (choice over mock/* +
  keep, Bearer ts-... header), model requests [m-big, m-big], /api/session model = mock/m-big. `run
  --continue --agent build` -> 0 Jev requests, session restored to mock/m-small, request used
  m-small. Fresh build run -> 0 Jev requests. Jev HTTP 400 -> model stays m-mid, exit 0. Spike:
  switchModel inside the prompt hook works for the same prompt, no deadlock; design section 5
  fallback not needed (ADR logged).

  Behaviour notes for QA: (1) fallbackModel option is intentionally unused in stage A (failure/keep
  = current model). (2) Without a `models` allowlist the candidate list is capped at 12 (current
  model pinned, round-robin over fast/balanced/reasoning/large-context, newest first) - a real
  install with ~45 models only offers 12; document the allowlist in README. (3) A `keep` answer
  yields a fallback plan with reason 'Jev chose to keep the current model' per AC; later tickets:
  plan.source becomes 'jev' whenever any contributor decides. (4) Host session model carries variant
  'default'; applied model is stored as read back from the session so restore equality holds. (5)
  Local plugin files must live in .opencode/plugins/<name>/index.ts (bare .ts in plugins array not
  loaded). (6) With provider=none / no key the hook still runs, makes no Jev call that succeeds, and
  stores a fallback plan.

  For 0005/0006: add a StageAContributor to the contributors array in promptHookModule (questions
  prefixed skill:/tools:, apply fills plan.skills/plan.tools; prompt.skills is exposed on
  StageAInput.prompt); context hook reads turnPlans.getForTurn(sessionID, latestUserMessageId). Jev
  client is created inside promptHookModule - hoist it to a shared factory if the context hook
  (0007) needs the same instance.

  [2026-11-03T15:07:47.393Z] HAND-OFF QA → PM: QA PASS, all 7 AC verified. Evidence: bun test 211
  pass/0 fail, tsc --noEmit clean, OPENCODE_INTEGRATION=1 bun test tests/integration 8/8 pass (e2e
  on opencode 2.2.5: jevCode run switched to m-big with 1 batched Jev request and both model
  requests on m-big; --continue --agent build restored m-small with 0 Jev calls; fresh build run
  made 0 Jev calls; Jev 400 kept m-mid, exit 0). Code review: the hook never throws (outer
  try/catch, guarded log.warn and plans.set in finally); fail-open on
  null/timeout/outside-set/low-confidence/keep gives a fallback plan with a reason; non-jev agents
  only call restoreIfNeeded (zero ask, zero plan); the closed candidate set is validated through
  pickChoice; switchModel is called only when the id differs; the plan cache replaces per session
  and getForTurn checks turnKey. package.json has no BOM (starts 0x7B). Residual risks
  (non-blocking): the cap of 12 candidates without a `models` allowlist hides models on real
  installs (README should document it); fallbackModel is unused in stage A (by design); the
  entry-test warnings come from fake ctx and are expected. No source edits were made by QA. PM may
  close.

  [2026-11-03T15:08:04.948Z] HAND-OFF PM → PM: PM CLOSE: all 7 AC done: true; QA pass (bun test 211
  pass, integration 8/8, tsc clean); spike ADR logged. Residual risks forwarded to 0008 (models
  allowlist, plugin entry shape, no BOM).
