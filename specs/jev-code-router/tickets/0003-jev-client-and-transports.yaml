title: 'Provider-neutral Jev client: question model, three transports, fail-open'
status: closed
depends:
  - 0001-package-scaffold-and-config.yaml
tags:
  - BE
  - QA
next_responsibility: PM
scope: >-
  src/jev/* and tests. Out of scope: building the actual routing questions (done by router tickets)
  and any OpenCode hook code.
description: >-
  Implements story R7 and design D4. Define internal types in src/jev/types.ts: Question = choice
  {options: Record<string,string>} | noul {instructions} | score {levels: string[]}; Answer = choice
  {choice, confidence, probabilities} | noul {probability} | score {score, confidence} | error.
  Implement `JevClient.ask(state, questions): Promise<Answers | null>` that picks a transport from
  `provider` (auto: native decision model from ctx.model.list() with type "decision" ->
  TYPESAFE_API_KEY -> OPENROUTER_API_KEY -> none). Transports: native
  (ctx.experimental.generate.decisions; noul->predicate, choice->choices[], score->levels[]),
  typesafe (POST https://api.typesafe.ai/v1/systemone, Bearer key, model jev-latest, noul/choice
  criteria map/score criteria[]), openrouter (POST https://openrouter.ai/api/alpha/decisions,
  default model typesafe/jev-1.13). Enforce limits (choice <= 255 options, score <= 10 levels),
  timeout via AbortController, one retry on network/5xx, return null on any failure, truncate state
  to a size cap. src/jev/response.ts offers closed-set validation helpers (pickChoice(answer,
  allowed, minConfidence), noulAbove(answer, t)). Log a single notice when no transport is
  available.
notes: >-
  Upstream docs: https://docs.typesafe.ai/api/system-one.md and OpenCode types in @opencode/client
  (ExperimentalGenerateDecisionsInput). Can run in parallel with 0002.

