  [2026-11-03T14:35:09.722Z] HAND-OFF BE → QA: BE done. src/jev/{types,client,response,questions}.ts
  + transports/{http,typesafe,openrouter,native}.ts; tests/jev/{transports,client,response}.test.ts
  (52 tests, all pass; typecheck clean). API: createJevClient({options: Resolved, log, fetch?,
  listModels?, generateDecisions?, now?}) -> {ask(state, questions): Promise<Answers|null>,
  describe()}. Helpers: pickChoice(answer, allowed, minConf), noulProbability(answer),
  rankNoul(answers, prefix, threshold), scoreValue(answer, max); builders
  choiceQuestion/noulQuestion/scoreQuestion(instructions, ...). Semantics: partial success returns
  only usable answers (absent key = unanswered); a requested question missing from the response, or
  all-error answers => null. Limits: choice 1..255 options, score 2..10 levels, state cap
  STATE_MAX_CHARS=12000 (truncated string beyond). One deadline (timeoutMs) shared by
  resolution+attempt+retry; retry once only on network/5xx. Auto with apiKey option: typesafe unless
  key starts sk-or- or endpoint contains openrouter. Re-resolve after none at most every 60s.
  Caveats: (1) tests/entry.test.ts currently fails (expects MODULES == []) because the other BE's
  index.ts now registers an "agent" module - not from this ticket, entry test needs updating by 0002
  owner. (2) Native transport passes {signal} as 2nd arg to generateDecisions and uses ModelInfo.id
  as model id (not verified against a live decision model; none installed). (3) Score numeric scale
  is passed through as returned by Jev (use scoreValue to clamp).

