scope: >-
  Repo root of jevCode: package.json, tsconfig, test runner (bun test), src/index.ts, src/config.ts,
  src/log.ts, README stub. Out of scope: any routing logic, agent registration, Jev calls.
description: >-
  Create the publishable package `opencode-jevcode` per design.md D1 and section 3. TypeScript
  source is published as-is (`exports["."] = ./src/index.ts`), `@opencode/plugin` is a peer
  dependency (>=2.2.0) and a pinned devDependency (2.2.5). `src/index.ts` exports `Plugin.define({
  id: "jevcode", setup })` that parses options, creates the logger and wires modules that later
  tickets add (each wired behind a try/catch so setup never throws). `src/config.ts` parses and
  validates every option listed in design.md section 4 with safe defaults and clamping (thresholds
  0..1, timeouts > 0) and reads env keys. `src/log.ts` is a leveled logger (`debug` option) that
  redacts API keys.
