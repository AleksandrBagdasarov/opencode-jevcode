title: 'Phase 4: tool group routing and the context hook (stage B shell, system note)'
status: closed
depends:
  - 0004-model-router-and-prompt-hook.yaml
tags:
  - BE
  - QA
next_responsibility: PM
scope: >-
  src/router/tool-groups.ts, src/router/tool-router.ts, src/opencode/context-hook.ts, tests. Out of
  scope: message pruning (0007) except leaving the extension point.
description: >-
  Implements story R4, R6.2-R6.4 and design F7. Define tool groups (Exploration:
  read/grep/glob/list; Development: edit/write/patch; Execution: shell/terminal; Verification:
  test/lsp; Research: websearch/webfetch; Delegation: subagent/task; Database: MCP tools matching
  configurable patterns; Other) as ID patterns in tool-groups.ts, user-extensible by option. Add one
  `noul` per group (probability the group is needed) to the stage A batch; groups below
  toolThreshold become excluded. The context hook registers once, returns immediately unless
  event.agent === "jevCode", loads the cached plan (validating turnKey against the latest user
  message), deletes tools of excluded groups from event.tools, and appends a short routing note to
  event.system. Never delete: alwaysKeepTools, tools referenced by tool-call parts in
  event.messages, tools in unknown groups. If filtering would empty the tool set, delete nothing.
  The hook makes no Jev call on continuations.
notes: >-
  Tool removal is a request-shaping optimization only; permission system remains the security
  boundary (story R4.4). Can be developed in parallel with 0005 (different files, both extend the
  stage A batch via the question builders).

