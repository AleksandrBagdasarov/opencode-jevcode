title: 'Phase 3: skill selection and injection into prompt.skills'
status: closed
depends:
  - 0004-model-router-and-prompt-hook.yaml
tags:
  - BE
  - QA
next_responsibility: PM
scope: >-
  src/router/skill-router.ts, additions to src/jev/questions.ts and the stage A batch in
  prompt-hook, tests. Out of scope: tool groups, pruning.
description: >-
  Implements story R3. Build the skill catalog from ctx.skill.list() (id, description, short
  capability text). Prefilter lexically to at most 30 skills. Add one `noul` question per
  shortlisted skill to the stage A batched request. Select skills with probability >=
  skillThreshold, at most maxSkills, ordered by probability. Validate each id against
  ctx.skill.list() and push `{ id }` into event.prompt.skills, skipping skills the user already
  selected. Never copy skill Markdown into the system prompt.
notes: >-
  Skill attachments are objects {id, mention?}, not strings (design F5). Feature.md called the
  yes/no primitive Noul; OpenCode native calls it predicate.

